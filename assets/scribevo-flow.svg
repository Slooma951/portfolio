<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" role="img"><title>Scribevo: the writer stays in control</title><rect width="720" height="505" rx="18" fill="#f2f4f7"/><g font-family="Arial,sans-serif" fill="#18202f"><text x="35" y="49" font-size="23" font-weight="bold">Scribevo: the writer stays in control</text><rect x="35" y="85" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="124" r="20" fill="#e8f0fc"/><text x="72" y="130" text-anchor="middle" font-size="15" fill="#1768d8">1</text><text x="112" y="114" font-size="19" font-weight="bold">Write a sentence</text><text x="112" y="140" font-size="14" fill="#596579">Use a supported browser text field.</text><path d="M360 166v16m-5-5 5 5 5-5" stroke="#86a1c7" fill="none" stroke-width="2"/><rect x="35" y="185" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="224" r="20" fill="#e8f0fc"/><text x="72" y="230" text-anchor="middle" font-size="15" fill="#1768d8">2</text><text x="112" y="214" font-size="19" font-weight="bold">Ask for writing support</text><text x="112" y="240" font-size="14" fill="#596579">The selected sentence is checked, rather than the whole document.</text><path d="M360 266v16m-5-5 5 5 5-5" stroke="#86a1c7" fill="none" stroke-width="2"/><rect x="35" y="285" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="324" r="20" fill="#e8f0fc"/><text x="72" y="330" text-anchor="middle" font-size="15" fill="#1768d8">3</text><text x="112" y="314" font-size="19" font-weight="bold">Review the suggestion</text><text x="112" y="340" font-size="14" fill="#596579">See the proposed correction in context.</text><path d="M360 366v16m-5-5 5 5 5-5" stroke="#86a1c7" fill="none" stroke-width="2"/><rect x="35" y="385" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="424" r="20" fill="#e8f0fc"/><text x="72" y="430" text-anchor="middle" font-size="15" fill="#1768d8">4</text><text x="112" y="414" font-size="19" font-weight="bold">Accept or dismiss</text><text x="112" y="440" font-size="14" fill="#596579">The writer decides whether the sentence changes.</text></g></svg>