<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img"><title>DVS Note: organise and reflect</title><rect width="720" height="405" rx="18" fill="#f2f4f7"/><g font-family="Arial,sans-serif" fill="#18202f"><text x="35" y="49" font-size="23" font-weight="bold">DVS Note: organise and reflect</text><rect x="35" y="85" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="124" r="20" fill="#e8f0fc"/><text x="72" y="130" text-anchor="middle" font-size="15" fill="#1768d8">1</text><text x="112" y="114" font-size="19" font-weight="bold">Capture</text><text x="112" y="140" font-size="14" fill="#596579">Write a note, add a task or record a journal entry.</text><path d="M360 166v16m-5-5 5 5 5-5" stroke="#86a1c7" fill="none" stroke-width="2"/><rect x="35" y="185" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="224" r="20" fill="#e8f0fc"/><text x="72" y="230" text-anchor="middle" font-size="15" fill="#1768d8">2</text><text x="112" y="214" font-size="19" font-weight="bold">Organise</text><text x="112" y="240" font-size="14" fill="#596579">Use separate views for tasks, journals and the dashboard.</text><path d="M360 266v16m-5-5 5 5 5-5" stroke="#86a1c7" fill="none" stroke-width="2"/><rect x="35" y="285" width="650" height="78" rx="12" fill="white" stroke="#d4dfed"/><circle cx="72" cy="324" r="20" fill="#e8f0fc"/><text x="72" y="330" text-anchor="middle" font-size="15" fill="#1768d8">3</text><text x="112" y="314" font-size="19" font-weight="bold">Reflect</text><text x="112" y="340" font-size="14" fill="#596579">Review mood information alongside personal entries.</text></g></svg>